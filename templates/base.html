<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GoldenEye Detector - Evaluation{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-shield-check"></i>
            <div>
                <div class="title">GOLDENEYE DETECTOR<br>EVALUATION</div>
                <div class="subtitle">Model Generalization<br>Across Years</div>
            </div>
        </div>

        <div class="sidebar-nav nav flex-column">
            <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="nav-link {% if active == 'detection' %}active{% endif %}" href="{{ url_for('evaluasi') }}">
                <i class="bi bi-clipboard-data"></i> Evaluasi
            </a>
            <a class="nav-link {% if active == 'ketahanan' %}active{% endif %}" href="{{ url_for('ketahanan') }}">
                <i class="bi bi-shield-exclamation"></i> Uji Ketahanan
            </a>
            <a class="nav-link {% if active == 'history' %}active{% endif %}" href="{{ url_for('history') }}">
                <i class="bi bi-clock-history"></i> History
            </a>
            <a class="nav-link {% if active == 'about' %}active{% endif %}" href="{{ url_for('about') }}">
                <i class="bi bi-info-circle"></i> About
            </a>
        </div>

        <div class="sidebar-footer">
            © 2026 GoldenEye Detector<br>All rights reserved.
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="modal fade" id="flowDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Detail Flow</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
